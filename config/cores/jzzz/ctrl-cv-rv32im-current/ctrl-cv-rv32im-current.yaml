# yaml-language-server: $schema=https://raw.githubusercontent.com/riscv/riscv-unified-db/main/spec/schemas/config_schema.json

---
$schema: config_schema.json#
kind: architecture configuration
type: fully configured
name: ctrl-cv-rv32im-current
description: >-
  Ctrl-CV RV32IMF+Zba+Zbc configuration for the current RTL.
Floating-point state uses 32 dedicated 64-bit FPRs.
  Zbb is intentionally omitted because only a CoreMark-used subset exists.
  Privileged exceptions and interrupts remain incomplete.

implemented_extensions:
  - { name: I, version: "= 2.1" }
  - { name: M, version: "= 2.0" }
  - { name: F, version: "= 2.2.0" }
    - { name: D, version: "= 2.2.0" }
  - { name: Zicsr, version: "= 2.0" }
  - { name: Zba, version: "= 1.0.0" }
  - { name: Zbc, version: "= 1.0.0" }

  # UDB uses Sm to describe MXLEN and the machine-mode execution environment.
  # This does not mean the current RTL passes the complete Sm test suite.
  - { name: Sm, version: "= 1.12.0" }

params:
  # Basic architecture
  MXLEN: 32
  PHYS_ADDR_WIDTH: 32
  M_MODE_ENDIANNESS: little

  # misa = 0x40001120: RV32 + I + M + F
  MISA_CSR_IMPLEMENTED: true
  MUTABLE_MISA_M: false
  MUTABLE_MISA_F: false

  # RV32F architectural state
  HW_MSTATUS_FS_DIRTY_UPDATE: precise
  MSTATUS_FS_LEGAL_VALUES: [0, 3]

  # Current synchronous trap behavior
  PRECISE_SYNCHRONOUS_EXCEPTIONS: true
  TRAP_ON_ECALL_FROM_M: true
  TRAP_ON_EBREAK: true
  TRAP_ON_UNIMPLEMENTED_INSTRUCTION: true
  TRAP_ON_RESERVED_INSTRUCTION: true
  TRAP_ON_UNIMPLEMENTED_CSR: true
  TRAP_ON_ILLEGAL_WLRL: false

  # Current mtval behavior
  REPORT_VA_IN_MTVAL_ON_BREAKPOINT: false
  REPORT_VA_IN_MTVAL_ON_LOAD_MISALIGNED: false
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_MISALIGNED: false
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_MISALIGNED: false
  REPORT_VA_IN_MTVAL_ON_LOAD_ACCESS_FAULT: false
  REPORT_VA_IN_MTVAL_ON_STORE_AMO_ACCESS_FAULT: false
  REPORT_VA_IN_MTVAL_ON_INSTRUCTION_ACCESS_FAULT: false
  REPORT_ENCODING_IN_MTVAL_ON_ILLEGAL_INSTRUCTION: true
  MTVAL_WIDTH: 32

  # Nearest UDB representation.
  # Current RTL neither correctly completes nor traps all misaligned accesses,
  # so Misalign/Exceptions tests will be excluded from current-v1.
  MISALIGNED_LDST: false
  MISALIGNED_LDST_EXCEPTION_PRIORITY: high

  # Identification CSRs currently read as zero/unimplemented
  MARCHID_IMPLEMENTED: false
  MIMPID_IMPLEMENTED: false
  VENDOR_ID_BANK: 0
  VENDOR_ID_OFFSET: 0
  CONFIG_PTR_ADDRESS: 0

  PMA_GRANULARITY: 2

  # mtvec currently supports direct mode and 4-byte alignment
  MTVEC_MODES: [0]
  MTVEC_ACCESS: rw
  MTVEC_ILLEGAL_WRITE_BEHAVIOR: custom
  MTVEC_BASE_ALIGNMENT_DIRECT: 4

  # No mhpmcounter3..31 counters are implemented.
  HPM_COUNTER_EN: [
    false, false, false, false, false, false, false, false,
    false, false, false, false, false, false, false, false,
    false, false, false, false, false, false, false, false,
    false, false, false, false, false, false, false, false
  ]

  # mcycle/minstret and their inhibit bits are implemented; all HPM inhibit
  # bits are hardwired to zero.
  MCOUNTINHIBIT_IMPLEMENTED: true
  COUNTINHIBIT_EN: [
    true, false, true, false, false, false, false, false,
    false, false, false, false, false, false, false, false,
    false, false, false, false, false, false, false, false,
    false, false, false, false, false, false, false, false
  ]


  MCOUNTENABLE_EN: [
    false, false, false, false, false, false, false, false,
    false, false, false, false, false, false, false, false,
    false, false, false, false, false, false, false, false,
    false, false, false, false, false, false, false, false
  ]

  NUM_PMP_ENTRIES: 0
