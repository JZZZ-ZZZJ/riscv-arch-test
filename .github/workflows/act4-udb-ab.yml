name: ACT4 cloud test

on:
  workflow_dispatch:
    inputs:
      extensions:
        description: "ACT4 extensions, comma separated"
        required: true
        default: "I"
        type: string

permissions:
  contents: read

jobs:
  rv32-sail:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Fetch current repository commit
        shell: bash
        env:
          REPOSITORY_URL: https://github.com/${{ github.repository }}.git
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          git init source
          git -C source remote add origin "$REPOSITORY_URL"
          git -C source fetch --depth=1 origin "$COMMIT_SHA"
          git -C source checkout --detach FETCH_HEAD

          test "$(git -C source rev-parse HEAD)" = "$COMMIT_SHA"
          sudo chown -R 1000:1000 source

      - name: Build and run ACT4 tests with Sail
        shell: bash
        env:
          ACT4_EXTENSIONS: ${{ inputs.extensions }}
          ACT4_IMAGE: ghcr.io/riscv/act4-build@sha256:4b4d8d687bdbfc33e66b107f3baa0394efd6dc804f71f5048ec3e21d3bc96d91
        run: |
          set -euo pipefail

          docker pull "$ACT4_IMAGE"

          docker run --rm \
            --platform linux/amd64 \
            --user 1000:1000 \
            --env ACT4_EXTENSIONS \
            --volume "$GITHUB_WORKSPACE/source:/act4" \
            --workdir /act4 \
            "$ACT4_IMAGE" \
            bash -lc '
              set -euo pipefail

              mise trust /act4/.mise.toml

              mise install
              mise exec -- uv sync

              export PATH="/act4/.venv/bin:$PATH"
              export UV_LINK_MODE=copy

              make clean clean-tests
              make -j1 sail-rv32-max \
                EXTENSIONS="$ACT4_EXTENSIONS" \
                CLEAN_INTERMEDIATES=True \
                2>&1 | tee /act4/act4-cloud.log
            '

      - name: Upload ACT4 logs and ELFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: act4-cloud-run-${{ github.run_number }}
          path: |
            source/act4-cloud.log
            source/work/sail-rv32-max/elfs/
          if-no-files-found: warn
          retention-days: 14
